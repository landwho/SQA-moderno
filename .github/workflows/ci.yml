
name: CitasSQA - Quality Gate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Unit Tests, Coverage, Integration
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear directorio de evidencias
        run: mkdir -p evidence

      - name: Analisis estatico ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee evidence/eslint.log

      - name: Pruebas unitarias y cobertura
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee evidence/unit-tests-coverage.log

      - name: Pruebas de integracion
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee evidence/integration-tests.log

      - name: Resumen de calidad
        if: always()
        shell: bash
        run: |
          {
            echo "## CitasSQA - Quality Gate"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Rama: $GITHUB_REF_NAME"
            echo "- Resultado: ${{ job.status }}"
            echo "- Analisis estatico: ESLint"
            echo "- Pruebas: unitarias e integracion"
            echo "- Cobertura: consultar unit-tests-coverage.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citas-sqa-quality-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Auditoria de seguridad de dependencias
        shell: bash
        run: |
          mkdir -p evidence
          npm audit --audit-level=high --json > evidence/security-audit.json
      # - name: Simulacion controlada de incidente de seguridad
      #   if: ${{ vars.SQA_SIMULATE_SECURITY_FAILURE == 'true' }}
      #   shell: bash
      #   run: |
      #     mkdir -p evidence
      #     echo "SEC-001: Fallo de seguridad simulado" \
      #       | tee evidence/security-failure.log
      #     echo "Quality Gate rechazado por politica de seguridad"
      #     exit 1
      - name: Auditoria de seguridad de dependencias
        shell: bash
        run: |
          mkdir -p evidence
          npm audit --audit-level=high --json > evidence/security-audit.json